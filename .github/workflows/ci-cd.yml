name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies (Backend)
      run: |
        cd backend
        npm install

    - name: Install dependencies (Frontend)
      run: |
        cd frontend
        npm install

    - name: Run tests
      run: |
        cd backend
        npm test || true

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Deploy to Render
      if: github.ref == 'refs/heads/main'
      run: |
        curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
